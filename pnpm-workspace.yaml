packages:
  - "apps/*"
  # The WhatsApp gateway ships as its own Docker image with its own npm install (as Synculariti's
  # sidecar does): its WhatsApp library stays out of every other install and CI run.
  - "!apps/whatsapp-gateway"
  - "packages/*"
  - "supabase"
allowBuilds:
  '@pnpm/exe': true
  sharp: false
  unrs-resolver: false
overrides:
  compression: "1.8.2"
  fast-uri: "3.1.9"
