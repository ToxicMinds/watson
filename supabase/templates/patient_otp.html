<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Watson sign-in code</title>
  </head>
  <body style="margin:0;background:#eef0f2;color:#161b26;font-family:Arial,sans-serif">
    <main style="box-sizing:border-box;max-width:520px;margin:32px auto;padding:32px;background:#fff;border:1px solid #d0d5dc;border-radius:12px">
      <p style="margin:0 0 24px;color:#23407a;font-size:26px;font-weight:700">Watson</p>
      <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3">Your sign-in code</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.6">Enter this one-time code to sign in. It expires in 10 minutes.</p>
      <p style="margin:0 0 24px;padding:16px;background:#e4e7eb;border-radius:8px;text-align:center;font-family:monospace;font-size:32px;letter-spacing:0.2em">{{ .Token }}</p>
      <p style="margin:0;color:#4a5160;font-size:14px;line-height:1.5">If you didn’t request this code, you can ignore this email. Never share the code with anyone.</p>
    </main>
  </body>
</html>
