[project]
name = "clinical-worker"
version = "0.1.0"
description = "Local-only transcription worker (development POC, synthetic data only)"
readme = "README.md"
authors = [
    { name = "Nikhil Shanbhag", email = "nikibmacc@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "av<19",  # faster-whisper 1.2.1 passes metadata_errors, removed in av 19
    "faster-whisper>=1.2.1",
    "pydantic>=2.14.1",
    "supabase>=2.32,<3",
    "llama-cpp-python==0.3.36",  # fills in forms with a local model (decision 0005)
    "pypdfium2>=5.14",  # reads the text of PDFs the patient sends, and renders scanned pages
    "rapidocr>=3.10",  # reads photos and scans, with a Latin model that keeps diacritics
    "pillow>=13.0.0",
]

[tool.uv]
# Security floors for transitive packages used by HTTPS and Hugging Face model downloads.
constraint-dependencies = ["certifi>=2026.10.19", "filelock>=4.2.1"]

[project.scripts]
clinical-worker = "clinical_worker.__main__:main"

# Where llama-cpp-python comes from. Linux (the cloud engine, CI): the prebuilt CPU wheel, so
# installing never compiles llama.cpp. macOS: the v0.3.36 Apple-silicon wheel is corrupt upstream
# (found by Prasanth, 24 Oct), so the verified source archive is built there instead.
[tool.uv.sources]
llama-cpp-python = [
  { index = "llama-cpp-cpu", marker = "sys_platform == 'linux'" },
  { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36/llama_cpp_python-0.3.36.tar.gz", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use a throwaway password for local accounts, call CLI tools on PATH,
# and seed random noise.
"tests/*" = ["S101", "E501", "S105", "S311", "S603", "S607"]

[tool.pytest.ini_options]
# supabase-py warns about its own internal arguments.
filterwarnings = ["ignore::DeprecationWarning:supabase.*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]


[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "llama_cpp.*"]
ignore_missing_imports = true
